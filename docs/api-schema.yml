          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    PatchedUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          maxLength: 50
        bio:
          type: string
          maxLength: 200
        status:
          $ref: '#/components/schemas/StatusEnum'
        avatar:
          type: string
          format: uri
          nullable: true
        is_email_verified:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 100
        display_name:
          type: string
          maxLength: 50
        password:
          type: string
          writeOnly: true
        password2:
          type: string
          writeOnly: true
      required:
      - display_name
      - email
      - id
      - password
      - password2
    StatusEnum:
      enum:
      - online
      - away
      - dnd
      type: string
      description: |-
        * `online` - Online
        * `away` - Away
        * `dnd` - Do not disturb
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          maxLength: 50
        bio:
          type: string
          maxLength: 200
        status:
          $ref: '#/components/schemas/StatusEnum'
        avatar:
          type: string
          format: uri
          nullable: true
        is_email_verified:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - display_name
      - email
      - id
      - is_email_verified
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
